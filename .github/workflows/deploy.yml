name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Start MongoDB replica set
        run: |
          docker run -d --name mongo -p 27017:27017 mongo:7 --replSet rs0 --bind_ip_all

          until docker exec mongo mongosh --eval "db.adminCommand('ping')" --quiet 2>/dev/null; do
            sleep 2
          done

          docker exec mongo mongosh --eval \
            "rs.initiate({ _id: 'rs0', members: [{ _id: 0, host: '127.0.0.1:27017' }] })"

          until docker exec mongo mongosh --eval "rs.isMaster().ismaster" --quiet 2>/dev/null | grep -q true; do
            sleep 1
          done

      - name: Install dependencies
        run: npm ci
        working-directory: server

      - name: Run tests
        run: npm test
        working-directory: server
        env:
          DATABASE_URL: mongodb://127.0.0.1:27017/chemu_test?replicaSet=rs0&directConnection=true
          JWT_SECRET: ci-test-secret
          JWT_EXPIRES_IN: 15m
          PORT: 3000

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment: deploy
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Strip client and test code
        run: |
          rm -rf client/
          find server -type d -name __tests__ -exec rm -rf {} + 2>/dev/null || true
          rm -rf notes/ docs/ .wolf/ DESIGN_BRIEF.md

      - name: Push deploy branch
        run: |
          git add -A
          git commit -m "deploy: $(git rev-parse --short HEAD)"
          git push origin HEAD:deploy --force

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd ~/Chem-App
            git fetch origin deploy && git reset --hard origin/deploy
            docker compose up -d --build server
            
